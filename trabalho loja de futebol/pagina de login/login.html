
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Futbol Store</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container-login">

        <div class="caixa-acesso">

            <div class="logo">
                <span>⚽</span>
                <h1>FUTBOL STORE</h1>
            </div>

            <div class="abas">
                <button type="button" id="abaLogin"
                    class="aba ativa" onclick="mostrarLogin()">
                    ENTRAR
                </button>

                <button type="button" id="abaCadastro"
                    class="aba" onclick="mostrarCadastro()">
                    CADASTRAR
                </button>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->

            <form id="formLogin" onsubmit="fazerLogin(event)">

                <h2>Bem-vindo de volta!</h2>

                <p class="subtitulo">
                    Entre na sua conta para continuar.
                </p>

                <label for="emailLogin">E-mail</label>

                <input
                    type="email"
                    id="emailLogin"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senhaLogin">Senha</label>

                <input
                    type="password"
                    id="senhaLogin"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit" class="botao-principal">
                    ENTRAR
                </button>

            </form>


            <!-- FORMULÁRIO DE CADASTRO -->

            <form id="formCadastro"
                onsubmit="fazerCadastro(event)"
                class="escondido">

                <h2>Crie sua conta</h2>

                <p class="subtitulo">
                    Cadastre-se para fazer parte da Futbol Store.
                </p>

                <label for="nomeCadastro">Nome completo</label>

                <input
                    type="text"
                    id="nomeCadastro"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="emailCadastro">E-mail</label>

                <input
                    type="email"
                    id="emailCadastro"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senhaCadastro">Senha</label>

                <input
                    type="password"
                    id="senhaCadastro"
                    placeholder="Crie uma senha"
                    minlength="4"
                    required
                >

                <button type="submit" class="botao-principal">
                    CRIAR CONTA
                </button>

            </form>


            <!-- MENSAGEM -->

            <p id="mensagem"></p>

            <!-- ÁREA DO USUÁRIO LOGADO -->

            <div id="areaUsuario" class="escondido">

                <h2 id="nomeUsuarioLogado"></h2>

                <p class="subtitulo">
                    Você entrou na sua conta com sucesso!
                </p>

                <button
                    type="button"
                    class="botao-principal"
                    onclick="sairDaConta()">
                    SAIR DA CONTA
                </button>

            </div>

            <a href="../Página de Início/inicio.html" class="voltar">
    ← Voltar para a loja
</a>

        </div>

    </div>

    <script src="usuarios.js"></script>
    <script src="usuario.js"></script>
    <script src="login.js"></script>

</body>
</html>
